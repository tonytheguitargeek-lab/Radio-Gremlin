# The Meshing Around config.ini settings Radio Gremlin relies on. This is NOT a complete config:
# install.sh creates config.ini from Meshing Around's own config.template; edit that file.
# Addresses are placeholders (192.0.2.x is reserved for documentation).

[interface]
# Radio Gremlin talks to the radio over Wi-Fi/TCP (e.g. a LilyGO T-Beam on your network).
type = tcp
# Radio IP or hostname, optionally with :port (Meshtastic's API port is 4403)
hostname = 192.0.2.10:4403

# Everything else (bot name, MOTD, games, BBS, alerts, store-and-forward, hop logs, ...) is ordinary
# Meshing Around configuration: see https://github.com/SpudGunMan/meshing-around
# Tip for a quiet observer: leave the interactive features off until you know your local mesh's
# etiquette. Radio Gremlin never answers text messages that arrived via MQTT (see docs/MQTT-vs-RF.md).
