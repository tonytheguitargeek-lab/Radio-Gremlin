# Radio Gremlin settings. install.sh copies this to meshing-around/gremlin.ini.
# All addresses below are placeholders (192.0.2.x is reserved for documentation).
# Defaults keep every service on this computer only (127.0.0.1).

[radio]
# Normally leave these empty: the radio address is read from Meshing Around's config.ini
# ([interface] type = tcp, hostname = <radio IP>[:port]). Set them only to override it.
host =
port =

[api]
# Mesh Command API (runs inside the bot). Read-only: it never transmits on the mesh.
# 127.0.0.1 = this computer only (recommended).
# To let a Mesh Command CYD reach it, set bind to this computer's LAN address, e.g. 192.0.2.20.
# WARNING: that makes /status, /nodes and /traffic readable by ANY device on your network with
# NO password (traffic includes broadcast message text). Only do this on a network you trust.
bind = 127.0.0.1
port = 8765

[observatory]
# Mesh Observatory web dashboard
bind = 127.0.0.1
port = 8766
# Where the Observatory reads the API. Empty = http://127.0.0.1:<api port> (or the API bind address)
api_url =
# SQLite history. Contains other mesh users' node IDs, names, signal reports and positions: keep private.
database = observatory.db

[watchdog]
# Seconds between radio-link checks
check_interval = 15
# Python used to run the bot (relative to meshing-around/)
python = venv/bin/python
